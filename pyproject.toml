[project]
name = "julkalender"
version = "0.1.0"
description = "D-sektionens Julkalender"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "Django==6.1.3",
    "Pillow==13.0.0",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "django-cleanup==9.0.0",
    "django-dbbackup==5.4.0",
    "psycopg[binary]==3.3.8",
    "uWSGI==2.0.31",
]

# The Django project lives in src/ and is not itself an installable package.
[tool.uv]
package = false
